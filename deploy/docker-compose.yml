services:
  api:
    build:
      context: ../api
    ports:
      - "8080:8080"
    environment:
      Auth0__Domain: ${AUTH0_DOMAIN:?Set AUTH0_DOMAIN in deploy/.env}
      Auth0__Audience: ${AUTH0_AUDIENCE:?Set AUTH0_AUDIENCE in deploy/.env}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  ui:
    build:
      context: ../ui
      args:
        VITE_AUTH0_DOMAIN: ${AUTH0_DOMAIN:?Set AUTH0_DOMAIN in deploy/.env}
        VITE_AUTH0_CLIENT_ID: ${AUTH0_UI_CLIENT_ID:?Set AUTH0_UI_CLIENT_ID in deploy/.env}
        VITE_AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:?Set AUTH0_AUDIENCE in deploy/.env}
    ports:
      - "8081:8080"
    depends_on:
      api:
        condition: service_healthy
